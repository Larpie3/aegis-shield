name: aegis_shield
description: Aegis Ad-Shield - One-tap Android system auditor for adware detection and purge.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.0
  animations: ^2.0.11
  shimmer: ^3.0.0
  device_info_plus: ^10.1.0
  package_info_plus: ^8.0.0
  iconsax: ^0.0.8
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  usage_stats: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
